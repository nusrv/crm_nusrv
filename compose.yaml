services:
  mariadb:
    image: mariadb:10.11
    environment:
      MARIADB_DATABASE: customer_lifecycle_cp
      MARIADB_USER: cp_user
      MARIADB_PASSWORD: cp_password
      MARIADB_ROOT_PASSWORD: local_root_password
    ports:
      - '3306:3306'
    volumes:
      - cp_mariadb_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 5s
      timeout: 5s
      retries: 15

  redis:
    image: redis:8-alpine
    ports:
      - '6379:6379'
    volumes:
      - cp_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cp_mariadb_data:
  cp_redis_data:
