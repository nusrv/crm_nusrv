# Safe validation of the temporary NUSRV CRM recovery branch.
# No real SMTP, JoFotara, production database or migration deploy occurs here.
name: P1 recovery source validation

# Manually triggered only for this NUSRV CRM recovery workflow.
# Do not run on every commit/push to the recovery branch.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p1-recovery-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-checks:
    name: Typecheck and P1 unit checks (no database or outbound mail)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_ENV: test
      APP_URL: http://127.0.0.1:3000
      WEB_URL: http://127.0.0.1:3000
      API_URL: http://127.0.0.1:3001
      NEXT_PUBLIC_API_URL: http://127.0.0.1:3001
      REDIS_URL: redis://127.0.0.1:1
      CAPTCHA_PROVIDER: mock
      CAPTCHA_TEST_TOKEN: isolated-source-validation
      MAIL_WORKERS_PAUSED: 'false'
      P2_ACTION_QUEUE_ENABLED: 'false'
      P2_SENT_OBSERVATION_ENABLED: 'false'
      P2_DSN_REVIEW_CAPTURE_ENABLED: 'false'
      DATABASE_URL: mysql://example:example@127.0.0.1:1/unconnected_ci
      JWT_ACCESS_SECRET: ci-only-not-a-valid-production-secret-at-least-32-chars
      JWT_REFRESH_SECRET: ci-only-different-not-a-valid-production-secret-32-plus
      ENCRYPTION_KEY_BASE64: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      SMTP_MODE: mock
      IMAP_MODE: mock
      AI_PROVIDER: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Generate Prisma client (no database connection)
        run: npm run db:generate
      - name: Workspace TypeScript check
        run: npm run typecheck
      - name: Focused P1 unit tests
        run: |
          npm run test -w @cp/api -- --runTestsByPath \
            src/modules/invoices/payment-money.spec.ts \
            src/modules/invoices/payments.service.spec.ts \
            src/modules/invoices/official-invoice-eligibility.spec.ts \
            src/modules/invoices/invoice-qr-corrections.controller.spec.ts \
            src/modules/renewal-cases/renewal-period.spec.ts \
            src/modules/renewal-cases/renewal-mail-recipient.spec.ts \
            src/modules/renewal-cases/accepted-renewal-invoice.spec.ts \
            src/modules/renewal-cases/legacy-renewal-recovery.controller.spec.ts \
            src/modules/renewal-cases/renewal-cases.controller.spec.ts \
            src/modules/mail/resend-attempt-guard.spec.ts \
            src/modules/invoices/invoices.service.spec.ts
      - name: Focused P2 source-only evidence and cursor policies
        run: |
          npm run test -w @cp/api -- --runTestsByPath \
            src/modules/mail/active-email-evidence.spec.ts \
            src/modules/mail/dsn-candidate-parser.spec.ts \
            src/modules/mail/mail-evidence-folder-identity.spec.ts \
            src/modules/mail/mail-evidence-sent-preview.spec.ts \
            src/modules/mail/mail-sent-observation-plan.spec.ts \
            src/modules/mail/mail-sent-source-identity.spec.ts \
            src/modules/mail/mail-sent-observation-commit.spec.ts \
            src/modules/mail/integration-health.service.spec.ts \
            src/modules/mail/integration-health.controller.spec.ts \
            src/modules/communications/operator-reply.service.spec.ts
      - name: Verify Chrome is available for real browser restart and Next UI checks
        run: |
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -x "$chrome"
          echo "P0_TEST_CHROME=$chrome" >> "$GITHUB_ENV"
          echo "P0_TEST_PROCESS_RESTART=1" >> "$GITHUB_ENV"
          echo "P0_TEST_NEXT_UI=1" >> "$GITHUB_ENV"
      - name: Complete API Jest regression (explicitly excludes live DB fixtures)
        run: npm run test -w @cp/api -- --testPathIgnorePatterns='mariadb.*live\.spec\.ts
      - name: P0 invariant Node tests (source only)
        run: |
          node --import tsx --test \
            apps/api/prisma/p01-additive-migrations.test.mjs \
            apps/api/prisma/p2-folder-evidence-migration.test.mjs \
            apps/api/prisma/p2-sent-observation-migration.test.mjs \
            apps/api/prisma/p2-dsn-follow-up-migration.test.mjs \
            apps/api/prisma/p2-provider-invalidation-migration.test.mjs \
            apps/api/src/identity/session-policy.test.mjs \
            apps/api/src/identity/verified-access-context.test.mjs \
            apps/api/src/modules/mail/smtp-attempt-policy.test.mjs \
            apps/web/lib/api.session.test.mjs
      - name: P2 provider binding and DSN ledger planning contracts (no database)
        run: node --experimental-strip-types --test apps/api/src/modules/mail/mail-provider-binding.test.mjs apps/api/src/modules/mail/dsn-follow-up-ledger-plan.test.mjs apps/api/src/modules/mail/dsn-follow-up-resolution.test.mjs
      - name: P2 DSN transaction orchestration contracts (no database)
        run: node --import tsx --test apps/api/src/modules/mail/dsn-follow-up-transaction.test.mjs apps/api/src/modules/mail/dsn-mime-shape.test.mjs apps/api/src/modules/mail/dsn-follow-up-flow.test.mjs apps/api/src/modules/mail/dsn-prisma-store.test.mjs
      - name: Report-shape review capture contracts (no database)
        run: node --experimental-strip-types --test apps/api/src/modules/mail/dsn-review-capture.test.mjs
      - name: Legacy DB launcher isolation contracts (no database)
        run: node --test apps/api/scripts/mariadb-integration-plan.test.mjs
      - name: Receipt and company invoice static rendering checks
        working-directory: apps/api
        run: |
          ../../node_modules/.bin/tsx ../web/tests/payment-receipt-renderer.check.tsx
          ../../node_modules/.bin/tsx ../web/tests/invoice-branding-renderer.check.tsx
      - name: Prisma schema validation (offline, no migration or DB connection)
        working-directory: apps/api
        run: ../../node_modules/.bin/prisma validate
      - name: Workspace ESLint checks
        run: npm run lint
      - name: Workspace production build (no deployment)
        run: NODE_ENV=production npm run build


      - name: Deployment maintenance policy (no database)
        run: node --experimental-strip-types --test apps/api/src/modules/mail/mail-worker-maintenance.test.mjs
      - name: OAuth cache identity contracts (no database)
        run: node --experimental-strip-types --test apps/api/src/modules/mail/oauth-cache-key.test.mjs
      - name: Sent generation identity contracts (no database)
        run: node --import tsx --test apps/api/src/modules/mail/mail-sent-source-identity.test.mjs
      - name: Workspace UI policy contracts (no database)
        run: node --experimental-strip-types --test apps/web/lib/invoice-create-selection.test.mjs apps/web/lib/workspace-navigation.test.mjs apps/web/lib/workspace-status.test.mjs

      - name: P0 invariant Node tests (source only)
        run: |
          node --import tsx --test \
            apps/api/prisma/p01-additive-migrations.test.mjs \
            apps/api/prisma/p2-folder-evidence-migration.test.mjs \
            apps/api/prisma/p2-sent-observation-migration.test.mjs \
            apps/api/prisma/p2-dsn-follow-up-migration.test.mjs \
            apps/api/prisma/p2-provider-invalidation-migration.test.mjs \
            apps/api/src/identity/session-policy.test.mjs \
            apps/api/src/identity/verified-access-context.test.mjs \
            apps/api/src/modules/mail/smtp-attempt-policy.test.mjs \
            apps/web/lib/api.session.test.mjs
      - name: P2 provider binding and DSN ledger planning contracts (no database)
        run: node --experimental-strip-types --test apps/api/src/modules/mail/mail-provider-binding.test.mjs apps/api/src/modules/mail/dsn-follow-up-ledger-plan.test.mjs apps/api/src/modules/mail/dsn-follow-up-resolution.test.mjs
      - name: P2 DSN transaction orchestration contracts (no database)
        run: node --import tsx --test apps/api/src/modules/mail/dsn-follow-up-transaction.test.mjs apps/api/src/modules/mail/dsn-mime-shape.test.mjs apps/api/src/modules/mail/dsn-follow-up-flow.test.mjs apps/api/src/modules/mail/dsn-prisma-store.test.mjs
      - name: Report-shape review capture contracts (no database)
        run: node --experimental-strip-types --test apps/api/src/modules/mail/dsn-review-capture.test.mjs
      - name: Legacy DB launcher isolation contracts (no database)
        run: node --test apps/api/scripts/mariadb-integration-plan.test.mjs
      - name: Receipt and company invoice static rendering checks
        working-directory: apps/api
        run: |
          ../../node_modules/.bin/tsx ../web/tests/payment-receipt-renderer.check.tsx
          ../../node_modules/.bin/tsx ../web/tests/invoice-branding-renderer.check.tsx
      - name: Prisma schema validation (offline, no migration or DB connection)
        working-directory: apps/api
        run: ../../node_modules/.bin/prisma validate
      - name: Workspace ESLint checks
        run: npm run lint
      - name: Workspace production build (no deployment)
        run: npm run build


      - name: Deployment maintenance policy (no database)
        run: node --experimental-strip-types --test apps/api/src/modules/mail/mail-worker-maintenance.test.mjs
      - name: OAuth cache identity contracts (no database)
        run: node --experimental-strip-types --test apps/api/src/modules/mail/oauth-cache-key.test.mjs
      - name: Sent generation identity contracts (no database)
        run: node --import tsx --test apps/api/src/modules/mail/mail-sent-source-identity.test.mjs
      - name: Workspace UI policy contracts (no database)
        run: node --experimental-strip-types --test apps/web/lib/invoice-create-selection.test.mjs apps/web/lib/workspace-navigation.test.mjs apps/web/lib/workspace-status.test.mjs

      - name: UTC cutover contracts (no database)
        run: node --experimental-strip-types --test apps/web/lib/mail-cutover.test.mjs

      - name: Manual QR structural contracts (no database)
        run: node --import tsx --test apps/api/src/modules/invoices/manual-qr.test.mjs
